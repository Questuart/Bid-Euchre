name: Codex Review

# Advisory-only code review overlay using OpenAI Codex CLI.
# This check is informational — it MUST NOT block merge or poison CI.
# Classification: "advisory" (see src/bid_euchre/ops/__init__.py)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "experiments/**"
      - "Makefile"
      - "pyproject.toml"

# Ensure only one review runs per PR at a time (cancel stale)
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # continue-on-error: infra failure must never poison CI
    continue-on-error: true

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Codex review
        id: review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: o3-mini
          prompt: |
            Review the changes in this pull request for:
            1. Correctness bugs and logic errors
            2. Unseeded randomness (random.Random() without seed, global random.*)
            3. Missing or inadequate test coverage for behavior changes
            4. Contract violations (import boundaries, data contract changes)
            5. Statistical rigor issues (missing CIs, inadequate sample sizes)

            Focus on actionable findings only. Do not flag style or formatting
            issues (ruff handles those). Do not flag documentation-only changes.

            For each finding, state:
            - Severity: BLOCK (must fix), WARN (should fix), or INFO (note)
            - File and line
            - What is wrong and why
            - Suggested fix

            If no issues are found, say "No issues found."
