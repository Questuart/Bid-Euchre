name: Dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/dashboard/**'
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:

concurrency:
  group: dashboard
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate dashboard
        run: uv run python scripts/generate_dashboard.py --output assets/dashboard/commit_bollinger.png

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet -- assets/dashboard/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated dashboard
        if: steps.changes.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update commit analytics dashboard [skip ci]"
          file_pattern: "assets/dashboard/*.png"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
