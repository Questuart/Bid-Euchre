name: Dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/dashboard/**'
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:

concurrency:
  group: dashboard
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate dashboard
        run: uv run python scripts/generate_dashboard.py --output assets/dashboard/commit_bollinger.png

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet -- assets/dashboard/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create dashboard update PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update commit analytics dashboard"
          title: "chore: update commit analytics dashboard"
          body: "Automated dashboard regeneration from CI."
          branch: chore/dashboard-auto-update
          delete-branch: true
          add-paths: "assets/dashboard/*.png"
