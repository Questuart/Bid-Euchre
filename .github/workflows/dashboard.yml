name: Dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/dashboard/**'
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:

concurrency:
  group: dashboard
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Generate dashboard
        run: uv run python scripts/generate_dashboard.py --output assets/dashboard/commit_bollinger.png
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet -- assets/dashboard/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open dashboard update PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/auto-dashboard"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add assets/dashboard/
          git commit -m "chore: update PR analytics dashboard"
          git push --force -u origin "$BRANCH"

          # Create PR if one doesn't already exist for this branch
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || echo "")
          if [ -z "$EXISTING" ]; then
            PR_URL=$(gh pr create \
              --title "chore: update PR analytics dashboard" \
              --body "Auto-generated dashboard update from CI." \
              --base main \
              --head "$BRANCH")
            echo "Created PR: $PR_URL"
            # Enable auto-merge if the repo setting allows it
            gh pr merge "$BRANCH" --auto --squash --delete-branch 2>/dev/null || echo "Auto-merge not available — PR will need manual merge"
          else
            echo "PR #$EXISTING already exists — branch updated via force-push"
          fi
