name: nightly-baseline-full

on:
  # Schedule disabled to conserve GitHub Actions minutes.
  # Re-enable when a deployed baseline warrants nightly regression checks.
  # schedule:
  #   - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-baseline-full
  cancel-in-progress: true

jobs:
  run-baseline-full:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: uv sync --frozen --extra dev

    - name: Run baseline_full suite
      run: |
        mkdir -p nightly_runs
        PYTHONPATH=src uv run python scripts/run_suite.py \
          --suite experiments/suites/baseline_full.yaml \
          --seed 42 \
          --n-per 500 \
          --run-dir nightly_runs \
          --no-reports

    - name: Check for failures in rollup.json
      run: |
        # Find rollup.json file
        ROLLUP_FILE=$(find nightly_runs -name "rollup.json" -type f | head -1)
        if [ -z "$ROLLUP_FILE" ]; then
          echo "Error: rollup.json not found"
          exit 1
        fi

        # Check if any entry has status != "ok"
        if jq -e '.summary[] | select(.status != "ok")' "$ROLLUP_FILE" > /dev/null; then
          echo "Failure detected in rollup.json"
          exit 1
        else
          echo "All tests passed"
        fi

    - name: Upload nightly runs artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: nightly-baseline-full-runs
        path: nightly_runs/

    - name: Create GitHub Issue on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;

          const issueBody = [
            '## Nightly Baseline Full Failure',
            '',
            'The scheduled baseline_full suite has failed.',
            '',
            '| Field | Value |',
            '|-------|-------|',
            '| **Workflow Run** | [View Run](' + runUrl + ') |',
            '| **Date** | ' + new Date().toISOString() + ' |',
            '| **Branch** | `' + context.ref + '` |',
            '',
            '### Next Steps',
            '',
            '1. Check the workflow run logs above',
            '2. Review the nightly-baseline-full-runs artifact',
            '3. Investigate any test failures or runner issues',
          ].join('\n');

          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `🚨 Nightly baseline_full failure - ${new Date().toISOString().split('T')[0]}`,
            body: issueBody,
            labels: ['bug', 'ci-failure']
          });
