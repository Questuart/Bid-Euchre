name: CI

on:
  pull_request:
    branches: [ "main" ]
    # No paths-ignore — always trigger so the required `tests` check
    # posts a status. Docs/plans-only PRs skip heavy steps via paths-filter.
  push:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Shared change detection (lightweight, ~5s) ───────────────────
  # Exports path-filter results so downstream jobs can be truly absent
  # (not just step-skipped) on non-matching PRs.  The required `tests`
  # job does NOT depend on this — it runs its own paths-filter to keep
  # the required check independent.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'src/**'
              - 'scripts/**'
              - 'tests/**'
              - 'experiments/**'
              - 'Makefile'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Detect changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'src/**'
              - 'scripts/**'
              - 'tests/**'
              - 'experiments/**'
              - 'Makefile'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            notebooks:
              - 'notebooks/**'
              - 'src/bid_euchre/diagnostics/**'
              - 'src/bid_euchre/reporting/**'

      # ── Lane logic ──────────────────────────────────────────────────
      # For pushes to main: always run everything.
      # For PRs: run lanes based on which paths changed.
      #   - "any_code" = code OR notebooks (anything that needs install)
      #   - Docs/plans-only PRs skip all heavy steps → fast green check.
      #
      # Condition shorthands used in steps below:
      #   push_or_code:      github.event_name == 'push' || steps.changes.outputs.code == 'true'
      #   push_or_any:       github.event_name == 'push' || steps.changes.outputs.code == 'true' || steps.changes.outputs.notebooks == 'true'
      #   push_or_notebooks: github.event_name == 'push' || steps.changes.outputs.notebooks == 'true'

      - name: Skip notice
        if: >-
          github.event_name == 'pull_request' &&
          steps.changes.outputs.code != 'true' &&
          steps.changes.outputs.notebooks != 'true'
        run: echo "::notice::Docs/plans-only PR — skipping all heavy steps"

      # ── Setup (shared across all lanes) ─────────────────────────────
      - name: Checkout
        if: >-
          github.event_name == 'push' ||
          steps.changes.outputs.code == 'true' ||
          steps.changes.outputs.notebooks == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: >-
          github.event_name == 'push' ||
          steps.changes.outputs.code == 'true' ||
          steps.changes.outputs.notebooks == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: >-
          github.event_name == 'push' ||
          steps.changes.outputs.code == 'true' ||
          steps.changes.outputs.notebooks == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Install package + dev deps
        if: >-
          github.event_name == 'push' ||
          steps.changes.outputs.code == 'true' ||
          steps.changes.outputs.notebooks == 'true'
        run: uv sync --frozen --extra dev

      # ── Fast checks (always, when any code touched) ─────────────────
      - name: Repo linter
        if: >-
          github.event_name == 'push' ||
          steps.changes.outputs.code == 'true' ||
          steps.changes.outputs.notebooks == 'true'
        run: make repo-lint

      - name: Validate configs
        if: >-
          github.event_name == 'push' ||
          steps.changes.outputs.code == 'true' ||
          steps.changes.outputs.notebooks == 'true'
        run: uv run python scripts/validate_configs.py

      - name: Docs freshness
        if: >-
          github.event_name == 'push' ||
          steps.changes.outputs.code == 'true' ||
          steps.changes.outputs.notebooks == 'true'
        run: make docs-check

      - name: Ruff (lint)
        if: >-
          github.event_name == 'push' ||
          steps.changes.outputs.code == 'true' ||
          steps.changes.outputs.notebooks == 'true'
        run: make lint

      # ── Code lane: pytest ───────────────────────────────────────────
      - name: Tests (fast)
        if: github.event_name == 'push' || steps.changes.outputs.code == 'true'
        run: make test

      # ── Notebook lane: hygiene + smoke execution ────────────────────
      - name: Notebook hygiene
        if: github.event_name == 'push' || steps.changes.outputs.notebooks == 'true'
        run: make notebook-check

      - name: Execute notebooks (smoke)
        if: github.event_name == 'push' || steps.changes.outputs.notebooks == 'true'
        run: make notebook-run

      # ── Promotion gate (label-triggered) ────────────────────────────
      - name: Promotion gate
        if: |
          (github.event_name == 'push' || steps.changes.outputs.code == 'true') &&
          contains(github.event.pull_request.labels.*.name, 'promotion')
        env:
          ARTIFACT_DIR: ${{ vars.ARTIFACT_DIR || '' }}
          ROLLUP_JSON: ${{ vars.ROLLUP_JSON || '' }}
          SPLIT_MANIFEST_DIR: ${{ vars.SPLIT_MANIFEST_DIR || '' }}
        run: |
          if [ -z "$ARTIFACT_DIR" ] || [ -z "$ROLLUP_JSON" ]; then
            echo "::error::Promotion gate requires ARTIFACT_DIR and ROLLUP_JSON. Set these repository variables or remove the 'promotion' label."
            exit 1
          fi
          make promotion-gate ARTIFACT_DIR="$ARTIFACT_DIR" ROLLUP_JSON="$ROLLUP_JSON" SPLIT_MANIFEST_DIR="${SPLIT_MANIFEST_DIR:-}"

  # ── Shadow sharding trial (non-required, PR code changes only) ──
  # Runs the fast test suite across 2 balanced shards using pytest-split.
  # This job is advisory — it does not block merges. It exists to measure
  # shard wall-clock, balance, and stability before promoting sharding to
  # replace the serial `tests` job.
  #
  # Gated on the `changes` job so the matrix is truly absent (not just
  # step-skipped) on docs/plans-only PRs and on push events.
  #
  # To promote: add an aggregation `tests-gate` job, update branch
  # protection to require `tests-gate`, then remove the serial `tests` job.
  tests-shadow-shard:
    needs: [changes]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install package + dev deps
        run: uv sync --frozen --extra dev

      - name: Tests (shard ${{ matrix.group }}/2)
        run: |
          echo "::group::Shard ${{ matrix.group }}/2 — pytest-split"
          PYTHONPATH=.:src uv run python -m pytest \
            -m "not slow" tests/ \
            --splits 2 --group ${{ matrix.group }} \
            -q --tb=short
          echo "::endgroup::"
