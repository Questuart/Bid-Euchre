name: CI

on:
  pull_request:
    branches: [ "main" ]
    # No paths-ignore — always trigger so the required `tests` check
    # posts a status. Docs/plans-only PRs skip heavy jobs via paths-filter
    # gating, and the `tests` aggregation gate passes on all-skipped upstream.
  push:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Change detection (PR only, ~5s) ───────────────────────────────
  # Exports path-filter results so downstream jobs can be truly absent
  # (not just step-skipped) on non-matching PRs.  On push events this
  # job is skipped; downstream jobs detect push and run unconditionally.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code }}
      notebooks_changed: ${{ steps.filter.outputs.notebooks }}
    steps:
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'src/**'
              - 'scripts/**'
              - 'tests/**'
              - 'experiments/**'
              - 'Makefile'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            notebooks:
              - 'notebooks/**'
              - 'src/bid_euchre/diagnostics/**'
              - 'src/bid_euchre/reporting/**'

  # ── Static checks (lint, config validation, docs freshness) ───────
  checks:
    needs: [changes]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        !(contains(github.event.pull_request.title, 'chore: update PR analytics dashboard') ||
          startsWith(github.head_ref, 'chore/auto-dashboard')))) &&
      (github.event_name == 'push' ||
       needs.changes.outputs.code_changed == 'true' ||
       needs.changes.outputs.notebooks_changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install package + dev deps
        run: uv sync --frozen --extra dev

      - name: Repo linter
        run: make repo-lint

      - name: Validate configs
        run: uv run python scripts/validate_configs.py

      - name: Docs freshness
        run: make docs-check

      - name: Ruff (lint)
        run: make lint

  # ── Sharded pytest (2-way split via pytest-split) ─────────────────
  # Two balanced shards run in parallel; both must pass for the `tests`
  # aggregation gate to succeed.  Uses the committed `.test_durations`
  # baseline.  Re-enabled after root cause fix for CI hang (#2311, #2321).
  tests-shard:
    needs: [changes]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        !(contains(github.event.pull_request.title, 'chore: update PR analytics dashboard') ||
          startsWith(github.head_ref, 'chore/auto-dashboard')))) &&
      (github.event_name == 'push' ||
       needs.changes.outputs.code_changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install package + dev deps
        run: uv sync --frozen --extra dev

      - name: Tests (shard ${{ matrix.group }}/2)
        run: |
          PYTHONPATH=.:src uv run python -m pytest \
            -m "not slow" tests/ \
            --splits 2 --group ${{ matrix.group }} \
            -q --tb=short

  # ── Notebook hygiene + smoke execution ────────────────────────────
  notebooks:
    needs: [changes]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        !(contains(github.event.pull_request.title, 'chore: update PR analytics dashboard') ||
          startsWith(github.head_ref, 'chore/auto-dashboard')))) &&
      (github.event_name == 'push' ||
       needs.changes.outputs.notebooks_changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install package + dev deps
        run: uv sync --frozen --extra dev

      - name: Notebook hygiene
        run: make notebook-check

      - name: Execute notebooks (smoke)
        run: make notebook-run

  # ── Promotion gate (label-driven, code PRs only) ──────────────────
  promotion-gate:
    needs: [changes]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        !(contains(github.event.pull_request.title, 'chore: update PR analytics dashboard') ||
          startsWith(github.head_ref, 'chore/auto-dashboard')))) &&
      (github.event_name == 'push' ||
       needs.changes.outputs.code_changed == 'true') &&
      contains(github.event.pull_request.labels.*.name, 'promotion')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install package + dev deps
        run: uv sync --frozen --extra dev

      - name: Promotion gate
        env:
          ARTIFACT_DIR: ${{ vars.ARTIFACT_DIR || '' }}
          ROLLUP_JSON: ${{ vars.ROLLUP_JSON || '' }}
          SPLIT_MANIFEST_DIR: ${{ vars.SPLIT_MANIFEST_DIR || '' }}
        run: |
          if [ -z "$ARTIFACT_DIR" ] || [ -z "$ROLLUP_JSON" ]; then
            echo "::error::Promotion gate requires ARTIFACT_DIR and ROLLUP_JSON. Set these repository variables or remove the 'promotion' label."
            exit 1
          fi
          make promotion-gate ARTIFACT_DIR="$ARTIFACT_DIR" ROLLUP_JSON="$ROLLUP_JSON" SPLIT_MANIFEST_DIR="${SPLIT_MANIFEST_DIR:-}"

  # ── Required aggregation gate ─────────────────────────────────────
  # This non-matrix job preserves the required `tests` check context
  # for normal PRs so branch protection needs no migration. Dashboard
  # chore PRs publish their own lightweight required checks from the
  # dashboard workflow because GITHUB_TOKEN-authored PRs do not trigger
  # pull_request workflows. This job evaluates all upstream lane results
  # and posts a single pass/fail status for the remaining PR types.
  #
  # Behavior:
  #   - if: always() ensures a status is posted even on docs-only PRs
  #   - Fails if any applicable upstream is failure or cancelled
  #   - Passes when all upstreams are success or skipped
  tests:
    needs: [changes, checks, tests-shard, notebooks, promotion-gate]
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        !(contains(github.event.pull_request.title, 'chore: update PR analytics dashboard') ||
          startsWith(github.head_ref, 'chore/auto-dashboard'))))
    runs-on: ubuntu-latest
    steps:
      - name: Skip notice
        if: >-
          github.event_name == 'pull_request' &&
          needs.checks.result == 'skipped' &&
          needs.tests-shard.result == 'skipped' &&
          needs.notebooks.result == 'skipped'
        run: echo "::notice::Docs/plans-only PR — all heavy jobs skipped"

      - name: Evaluate upstream results
        run: |
          echo "changes:        ${{ needs.changes.result }}"
          echo "checks:         ${{ needs.checks.result }}"
          echo "tests-shard:    ${{ needs.tests-shard.result }}"
          echo "notebooks:      ${{ needs.notebooks.result }}"
          echo "promotion-gate: ${{ needs.promotion-gate.result }}"

          results=("${{ needs.changes.result }}" "${{ needs.checks.result }}" "${{ needs.tests-shard.result }}" "${{ needs.notebooks.result }}" "${{ needs.promotion-gate.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Upstream job result: $r"
              exit 1
            fi
          done
          echo "All upstream jobs passed or were skipped — gate OK"
