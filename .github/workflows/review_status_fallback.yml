name: Review Status Fallback

on:
  schedule:
    - cron: '0 * * * *'  # Hourly

jobs:
  check-stuck:
    runs-on: ubuntu-latest

    steps:
      - name: Find stuck PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"

          # Find open PRs where reviewing-changes has been pending > 1 hour
          gh api "repos/${REPO}/pulls" --jq '.[] | select(.state == "open") | .number' | while read -r PR_NUM; do
            HEAD_SHA=$(gh pr view "$PR_NUM" --repo "$REPO" --json headRefOid -q .headRefOid)

            # Get the reviewing-changes status
            STATUS=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status" \
              --jq '.statuses[] | select(.context == "reviewing-changes") | .state' 2>/dev/null || echo "missing")
            CREATED=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status" \
              --jq '.statuses[] | select(.context == "reviewing-changes") | .created_at' 2>/dev/null || echo "")

            if [ "$STATUS" = "pending" ] && [ -n "$CREATED" ]; then
              AGE_SECONDS=$(( $(date +%s) - $(date -d "$CREATED" +%s) ))
              if [ "$AGE_SECONDS" -gt 3600 ]; then
                # Dedupe: skip if we already posted a fallback comment for this SHA
                EXISTING=$(gh api "repos/${REPO}/issues/${PR_NUM}/comments" \
                  --jq "[.[] | select(.body | contains(\"Review status fallback\")) | select(.body | contains(\"${HEAD_SHA:0:7}\"))] | length" 2>/dev/null || echo "0")
                if [ "$EXISTING" != "0" ]; then
                  echo "PR #${PR_NUM}: fallback already posted for ${HEAD_SHA:0:7} — skipping"
                  continue
                fi
                echo "PR #${PR_NUM}: reviewing-changes stuck pending for ${AGE_SECONDS}s"
                BODY="Review status fallback: reviewing-changes has been pending for >1 hour (sha: ${HEAD_SHA:0:7})."
                BODY="${BODY}"$'\n\n'"The Claude session may have ended before completing review. To unblock:"
                BODY="${BODY}"$'\n\n'"1. Re-run /reviewing-changes in a new Claude Code session, or"
                BODY="${BODY}"$'\n'"2. Manually set the status: scripts/internal/set_review_status.sh success \"Manual override\""
                gh pr comment "$PR_NUM" --repo "$REPO" --body "$BODY"
              fi
            fi
          done
