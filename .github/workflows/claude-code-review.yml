name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "experiments/**"
      - "notebooks/**"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a read-only code reviewer. Your job is to inspect the PR diff
            and relevant source files, then post review findings as PR comments.

            DO NOT attempt to modify files, create commits, push branches, or
            perform any implementation work. You may only read and comment.

            Review this pull request for:
            - Code correctness and logic errors
            - Security concerns
            - Adherence to project conventions (see CLAUDE.md)

            Post your findings as review comments on the PR.

          # --disallowedTools prevents the reviewer from attempting write tools
          # (Edit, Write, NotebookEdit) that get denied and waste turns toward
          # the max-turns budget.  The allowed_tools action input does NOT work
          # (not declared in claude-code-action@v1 action.yml) — use CLI flags
          # via claude_args instead.
          claude_args: '--max-turns 10 --disallowedTools "Edit,Write,NotebookEdit"'

      - name: Flag reviewer infra failure
        if: always() && steps.claude-review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        shell: bash
        run: |
          # Classify the failure: max-turns vs auth vs unknown
          SUBTYPE="unknown"
          DENIALS=0

          if [ -z "$EXECUTION_FILE" ]; then
            # Output was never set — action crashed before producing metadata.
            # The action does not set execution_file on error_max_turns exits,
            # so this is the most common case. Warn but do not create an issue.
            echo "::warning::claude-review exited without execution_file (likely max-turns exhaustion)"
            exit 0
          elif [ ! -f "$EXECUTION_FILE" ]; then
            # Path was set but file doesn't exist on disk
            SUBTYPE="execution_file_not_found"
          else
            # File exists — extract structured fields
            SUBTYPE=$(jq -r 'select(.type == "result") | .subtype // "unknown"' "$EXECUTION_FILE" 2>/dev/null | tail -1)
            DENIALS=$(jq -r 'select(.type == "result") | .permission_denials_count // 0' "$EXECUTION_FILE" 2>/dev/null | tail -1)
            # Guard against empty jq output
            [ -z "$SUBTYPE" ] && SUBTYPE="unparseable_execution_file"
            [ -z "$DENIALS" ] && DENIALS=0
          fi

          # error_max_turns is a normal operational boundary, not an infra failure.
          # Warn but do not create a noise issue.
          if [ "$SUBTYPE" = "error_max_turns" ]; then
            echo "::warning::claude-review hit max-turns (denials=$DENIALS) — not an infra failure"
            exit 0
          fi

          gh issue create \
            --title "claude-review infra failure on PR #${{ github.event.pull_request.number }} ($SUBTYPE)" \
            --body "The Claude Code Review action failed on PR #${{ github.event.pull_request.number }}.

          **Failure type:** \`$SUBTYPE\`
          **Permission denials:** $DENIALS
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This is a reviewer infrastructure issue, not a code review finding.
          The \`claude-review\` check remains failed on the PR as a visible signal." \
            --label "follow-up"
          echo "::warning::claude-review infra failure (subtype=$SUBTYPE, denials=$DENIALS) — issue created"
