name: Bid Eval Tiny Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bid_eval_tiny:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install package + dev deps
        run: uv sync --frozen --extra dev

      - name: Validate teacher roster manifest + bidding artifact schema
        env:
          PYTHONPATH: src
        run: |
          uv run python scripts/validate_teacher_roster.py

      - name: Run bid_eval_tiny suite
        env:
          PYTHONPATH: src
        run: |
          rm -rf data/runs/bid_eval_tiny
          mkdir -p data/runs
          uv run python scripts/run_suite.py \
            --suite experiments/suites/bid_eval_tiny.yaml \
            --seed 42 \
            --n-per 20 \
            --run-dir data/runs/bid_eval_tiny

      - name: Upload bid_eval_tiny reports
        uses: actions/upload-artifact@v4
        with:
          name: bid_eval_tiny-reports
          path: data/runs/bid_eval_tiny
