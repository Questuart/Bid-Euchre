<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Repeating suit pattern tile: spade, heart, diamond, club in a 2x2 grid -->
  <!-- Spade (top-left) -->
  <g transform="translate(30,30) scale(0.6)" fill="#fafafa">
    <path d="M0-20 C-2-18-16-8-16 3 C-16 11-10 16-5 16 C-2.5 16-1 14 0 12 C1 14 2.5 16 5 16 C10 16 16 11 16 3 C16-8 2-18 0-20Z"/>
    <rect x="-2.5" y="12" width="5" height="10" rx="1"/>
  </g>
  <!-- Heart (top-right) -->
  <g transform="translate(90,30) scale(0.6)" fill="#fafafa">
    <path d="M0 18 C-2 14-16 4-16-5 C-16-12-10-18-5-18 C-2-18 0-14 0-11 C0-14 2-18 5-18 C10-18 16-12 16-5 C16 4 2 14 0 18Z"/>
  </g>
  <!-- Diamond (bottom-left) -->
  <g transform="translate(30,90) scale(0.6)" fill="#fafafa">
    <path d="M0-20 L12 0 L0 20 L-12 0Z"/>
  </g>
  <!-- Club (bottom-right) -->
  <g transform="translate(90,90) scale(0.6)" fill="#fafafa">
    <circle cx="0" cy="-10" r="8"/>
    <circle cx="-9" cy="2" r="8"/>
    <circle cx="9" cy="2" r="8"/>
    <rect x="-2.5" y="5" width="5" height="12" rx="1"/>
  </g>
</svg>
