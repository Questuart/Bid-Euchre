<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Bid Euchre{% endblock %}</title>
    <meta name="description" content="Play Bid Euchre online against AI opponents. Double-deck, 10-to-Ace with bowers.">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bid Euchre">
    <meta name="theme-color" content="#1b5e20">
    <!-- Open Graph -->
    <meta property="og:title" content="Bid Euchre">
    <meta property="og:description" content="Play Bid Euchre online against AI opponents. Double-deck, 10-to-Ace with bowers.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ app_url | default('') }}/static/icons/icon-512.png">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/css/accessibility.css">
    <style>
        :root {
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-right: env(safe-area-inset-right, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-left: env(safe-area-inset-left, 0px);
        }

        body {
            padding: var(--safe-area-top) var(--safe-area-right) var(--safe-area-bottom) var(--safe-area-left);
        }
    </style>
    <!-- Apply text size preference before first paint to prevent FOUC -->
    <script>
        (function(){try{var s=localStorage.getItem('textSize');if(s==='large'){document.documentElement.setAttribute('data-text-size','large');}}catch(e){}})();
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/idiomorph@0.3.0/dist/idiomorph-ext.min.js"></script>
    <script src="/static/game.js" defer></script>
    <!-- Morph-swap script fix: idiomorph doesn't re-execute inline <script>
         tags when morphing DOM nodes.  After a game-board morph swap, clone
         any <script> elements so the browser treats them as new and executes
         them.  Fixes bid-panel controls and moon-exchange selection after
         morph-swapped transitions. -->
    <script>
        document.addEventListener('htmx:afterSwap',function(e){
            var t=e.target;if(!t||t.id!=='game-board')return;
            var s=t.querySelectorAll('script');
            for(var i=0;i<s.length;i++){var o=s[i],n=document.createElement('script');n.textContent=o.textContent;o.parentNode.replaceChild(n,o);}
        });
    </script>
    {% block head %}{% endblock %}
</head>
<body hx-ext="morph">
    <a href="#main-content" class="skip-link">Skip to game</a>
    <header role="banner">
        <div class="header-bar">
            <h1><a href="/" aria-label="Bid Euchre home">Bid Euchre</a></h1>
            {% if link_uuid is defined and link_uuid %}
            {% set _page = current_page | default("") %}
            <nav class="header-nav" role="tablist" aria-label="Main navigation">
                <a href="/play/{{ link_uuid }}" role="tab"
                   class="header-nav__tab{% if _page == 'game' %} header-nav__tab--active{% endif %}"
                   {% if _page == 'game' %}aria-selected="true"{% else %}aria-selected="false"{% endif %}>Game</a>
                <a href="/history/{{ link_uuid }}" role="tab"
                   class="header-nav__tab{% if _page == 'history' %} header-nav__tab--active{% endif %}"
                   {% if _page == 'history' %}aria-selected="true"{% else %}aria-selected="false"{% endif %}>History</a>
                <a href="/leaderboard/{{ link_uuid }}" role="tab"
                   class="header-nav__tab{% if _page == 'leaderboard' %} header-nav__tab--active{% endif %}"
                   {% if _page == 'leaderboard' %}aria-selected="true"{% else %}aria-selected="false"{% endif %}>Leaderboard</a>
                <a href="/comments/{{ link_uuid }}" role="tab"
                   class="header-nav__tab{% if _page == 'comments' %} header-nav__tab--active{% endif %}"
                   {% if _page == 'comments' %}aria-selected="true"{% else %}aria-selected="false"{% endif %}>Comments</a>
                <a href="/guide/{{ link_uuid }}" role="tab"
                   class="header-nav__tab{% if _page == 'guide' %} header-nav__tab--active{% endif %}"
                   {% if _page == 'guide' %}aria-selected="true"{% else %}aria-selected="false"{% endif %}>Guide</a>
            </nav>
            {% endif %}
            <button id="text-size-toggle"
                    class="text-size-toggle"
                    type="button"
                    aria-label="Toggle large text"
                    title="Toggle large text">Aa</button>
        </div>
    </header>
    <main id="main-content" role="main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
