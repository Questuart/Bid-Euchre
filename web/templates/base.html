<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Bid Euchre{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/icons/icon-192.svg">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bid Euchre">
    <meta name="theme-color" content="#1b5e20">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/css/accessibility.css">
    <style>
        :root {
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-right: env(safe-area-inset-right, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-left: env(safe-area-inset-left, 0px);
        }

        body {
            padding: var(--safe-area-top) var(--safe-area-right) var(--safe-area-bottom) var(--safe-area-left);
        }
    </style>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/idiomorph@0.3.0/dist/idiomorph-ext.min.js"></script>
    <script src="/static/game.js" defer></script>
    {% block head %}{% endblock %}
</head>
<body hx-ext="morph">
    <a href="#main-content" class="skip-link">Skip to game</a>
    <header role="banner">
        <div class="header-bar">
            <h1><a href="/" aria-label="Bid Euchre home">Bid Euchre</a></h1>
            {% if link_uuid is defined and link_uuid %}
            <nav class="header-nav" aria-label="Main navigation">
                <a href="/play/{{ link_uuid }}">Game</a>
                <a href="/history/{{ link_uuid }}">History</a>
                <a href="/leaderboard/{{ link_uuid }}">Leaderboard</a>
            </nav>
            {% endif %}
        </div>
    </header>
    <main id="main-content" role="main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
