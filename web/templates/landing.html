{% extends "base.html" %}

{% block title %}Bid Euchre — Play Online{% endblock %}

{% block content %}
<div class="landing-hero" role="region" aria-label="Welcome to Bid Euchre">
    <h2 class="landing-hero__title">Bid Euchre</h2>
    <div class="landing-hero__suits" aria-hidden="true">
        <span class="landing-hero__suit--spade">&spades;</span>
        <span class="landing-hero__suit--heart">&hearts;</span>
        <span class="landing-hero__suit--diamond">&diams;</span>
        <span class="landing-hero__suit--club">&clubs;</span>
    </div>
    <p class="landing-hero__subtitle">
        Double-deck, 10-to-Ace, with bowers. Play against AI opponents.
    </p>

    {% include "partials/invite_code_form.html" %}
</div>
{% endblock %}
