# =============================================================================
# EXPERIMENT REGISTRY
# =============================================================================
# This file documents all experiments, their configs, runners, and outputs.
# Use this to understand what experiments exist and how to reproduce them.
#
# FOLDER STRUCTURE (Updated 2026-01-04):
#   experiments/
#   ├── analysis/          - Analysis scripts (analyze_*)
#   ├── comparisons/       - Head-to-head comparisons (compare_*, run_*_comparison)
#   ├── dashboards/        - Dashboard generators (generate_*_dashboard)
#   ├── data_generation/   - Training data generation and conversion
#   ├── plotting/          - Plot generators (plot_*)
#   ├── training/          - Model training scripts
#   ├── configs/           - YAML configuration files
#   └── run_experiment.py  - Main unified experiment runner
#
# Status values:
#   - active: Currently used in production/analysis
#   - stable: Working but not actively used
#   - needs_config: Missing YAML config file
#   - deprecated: Superseded by another experiment
#   - one_off: Exploratory, not meant to be rerun
#
# Last updated: 2026-01-04
# =============================================================================

# =============================================================================
# CORE EXPERIMENT RUNNER
# =============================================================================

unified_experiment_runner:
  description: "Unified runner for strategy comparisons via YAML configs"
  runner: experiments/run_experiment.py
  config_pattern: experiments/configs/*.yaml
  status: active
  usage: |
    PYTHONPATH=src python experiments/run_experiment.py \
      --config experiments/configs/<name>.yaml
  outputs: data/runs/<experiment_name>_<seed>_<timestamp>/
  notes: "This is the preferred way to run experiments"

