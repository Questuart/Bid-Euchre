# Auction Comparator: compare bidders in auction mode
#
# Primary metric: net_eppd (expected net differential per deal)
# Gate: bid_rate > 0 for every comparator
#
# Usage (canonical v2 — config-pinned, no CLI injection):
#   uv run python scripts/internal/run_auction_comparator.py \
#     --config experiments/configs/auction_comparator.yaml \
#     --seed 42 --single-seat --n-per 5000 \
#     --output-format json \
#     --output data/artifacts/arc_d/r0/comparator_battery_r0_v6.json
#
# Note: --olsa-artifact CLI path remains for ad-hoc/exploration runs
# but is NOT used for canonical v2 batteries.

experiment_name: auction_comparator

bidding_policies:
  - name: fiveheadfred
    class_name: FixedBidder
    params: {n: 5, contract: "S"}

  - name: stricthellraiser
    class_name: StrictHellRaiser

  - name: rankthetank
    class_name: RanktheTank

  - name: modeloespecifico
    class_name: ModeloEspecifico

  # OLSa floor-based bidder using constrained-arm coefficients
  - name: olsa
    class_name: OLSaBidder
    params:
      artifact_path: data/artifacts/arc_d/r0/hybrid_r0.json

  # OLSa floor-based bidder using full-arm coefficients
  - name: olsa_full
    class_name: OLSaBidder
    params:
      artifact_path: data/artifacts/arc_d/r0/hybrid_r0_full.json

  # Hybrid OLSa with Gaussian EV wrapper — constrained arm + bid-level search
  - name: hybrid_olsa
    class_name: HybridOLSaBidder
    params:
      artifact_path: data/artifacts/arc_d/r0/hybrid_r0.json
      bid_level_search: true
      risk_lambda: 0.0  # placeholder — Track D updates after lambda selection

  # Hybrid OLSa with Gaussian EV wrapper — full arm + bid-level search
  - name: hybrid_olsa_full
    class_name: HybridOLSaBidder
    params:
      artifact_path: data/artifacts/arc_d/r0/hybrid_r0_full.json
      bid_level_search: true
      risk_lambda: 0.0  # placeholder — Track D updates after lambda selection

strategies:
  - name: glutton
    class_name: GluttonStrategy

scenarios:
  - contract_type: null  # Auction mode

parameters:
  play_strategy: glutton
  n_per: 10000
  seed: 42
  log_level: hand
