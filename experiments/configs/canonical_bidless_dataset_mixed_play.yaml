# Canonical Bidless Dataset Configuration (Mixed-Play: Analysis)
#
# Purpose: Collect diverse outcomes across multiple play policies for diagnostics
# and analysis. Uses multiple strategies in self-play mode for strategy diversity.
#
# WARNING: Do NOT train bidding models on this dataset without conditioning on
# play policy. Outcome labels mix greedy, glutton, and random play quality,
# making them inconsistent for supervised learning.
#
# For ML training with consistent labels, use canonical_bidless_dataset_greedy.yaml.
#
# Strategies:
#   - greedy: Conservative play-to-win strategy
#   - glutton: Aggressive trick-taking strategy
#   - random_legal: Random baseline for variety
#
# Total hands: 50,000 x 6 scenarios x 3 strategies = 900,000 hands
#
# Usage:
#   PYTHONPATH=src python experiments/run_experiment.py \
#       --config experiments/configs/canonical_bidless_dataset_mixed_play.yaml \
#       --seed 42 \
#       --emit-bidless-dataset \
#       --emit-bidless-outcomes-dataset
#
# Outputs (in <run_dir>/datasets/):
#   - bidless.parquet + bidless.jsonl + bidless_meta.json (features)
#   - bidless_outcomes.parquet + bidless_outcomes.jsonl + bidless_outcomes_meta.json (outcomes)

experiment_name: canonical_bidless_dataset_mixed_play

parameters:
  seed: 42
  n_per: 50000
  log_level: none
  mode: self_play
  pair_deals: true

strategies:
  - name: greedy
    class_name: GreedyStrategy

  - name: glutton
    class_name: GluttonStrategy

  - name: random_legal
    class_name: RandomLegalStrategy
    params:
      seed: 42

scenarios:
  - contract_type: suit
    trump_suit: C,D,H,S
  - contract_type: high
  - contract_type: low
