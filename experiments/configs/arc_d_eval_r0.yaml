# Arc D R0 Evaluation — OLSa (constrained arm)
# Self-play: HybridOLSaBidder R0 vs HybridOLSaBidder R0
#
# Run with:
#   uv run python experiments/run_experiment.py \
#     --config experiments/configs/arc_d_eval_r0.yaml --seed 42

experiment_name: arc_d_eval_r0

bidding_policies:
  - name: hybrid_olsa_r0
    class_name: HybridOLSaBidder
    params:
      artifact_path: data/artifacts/arc_d/r0/hybrid_r0.json
      bid_level_search: true

scenarios:
  - contract_type: null  # Auction mode

parameters:
  n_per: 50000
  seed: 42
  log_level: hand
