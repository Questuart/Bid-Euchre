# Loner-void per-contract-type head-to-head comparator (bidless)
#
# Purpose
# -------
# Measure the competitive impact of `void_backed_lead` (Issue #2627, Option A)
# per contract type by pitting void-lead Glutton against baseline Glutton on
# the same deals with forced (pre-declared) contracts. No bidding policy is
# used — the contract is fixed per scenario, isolating pure play differences.
#
# Design
# ------
# Team 0 (seats 0, 2): GluttonStrategy with cash_winners_on_lead=True, void_backed_lead=True
# Team 1 (seats 1, 3): GluttonStrategy with cash_winners_on_lead=True, void_backed_lead=False
#
# Both teams retain cash_winners_on_lead=True (current production default per
# PR #2588). The only variable is the new void_backed_lead flag. Baseline
# (void_backed_lead=False) is the current production behaviour.
#
# Both seat rotations are included to control for seat bias. Pool both
# matchup directions with sign flip for the final estimate.
#
# Expected results (from Issue #2627 code analysis):
# - High and low contracts: measurable positive signal — the void-backed pass
#   fires in the HIGH/LOW path of _choose_lead whenever both opponents are
#   void in a suit, redirecting the lead to a guaranteed-winner suit.
# - Suit contracts: near-zero delta (inertness control) — the void_backed_lead
#   fix is gated under cash_a_active which only fires for high/low, so suit
#   contracts should show Δ ≈ 0.000.
#
# Low contract is the primary target: loner LOW hands (bid_type=loner,
# contract_type=low) are where the original bug was observed (Issue #2627).
# The forced-low scenario captures the HIGH/LOW _choose_lead path that the
# fix modifies, including in regular 4-player low hands. Loner-specific signal
# (partner sitting out → opponent voids accumulate faster) is best measured
# in the auction comparator (loner_void_comparator.yaml).
#
# Compute budget
# --------------
# 2 matchups × 6 scenarios × 5,000 deals = 60,000 hands. At ~5,000
# hands/sec bidless throughput this completes in ~12 s.
#
# MDE at n=5000 per scenario (paired SD ≈ 1.0 on tricks_team0):
# ~0.055 tricks at 95% CI.
#
# Analysis plan
# -------------
# - Primary: paired bootstrap delta on tricks_team0 per contract type per
#   matchup direction
# - Pool both matchup directions with sign flip to control seat bias
# - Inertness check: suit deltas should be ≈ 0.000 (fix not firing)
# - Signal: high/low deltas are the real measure — positive = fix helps
#
# Success criteria
# ----------------
# Clear win:       high or low Δ > 0.10 tricks  (Cohen's d > 0.05)
# Wash / noise:    |Δ| < 0.05 tricks            (below MDE floor)
# Regression:      Δ < −0.10 tricks             (fix hurts meaningfully)
#
# Inertness gate (suits must clear before reporting high/low as real):
#   All 4 suit scenarios: |Δ| < 0.10 tricks (within 2× noise floor)
#
# Depends on
# ----------
# - PR implementing void_backed_lead Option A from Issue #2627:
#   GluttonStrategy.__init__(void_backed_lead: bool = False)
#   _choose_lead HIGH/LOW path: void-backed pass under cash_a_active
#   GluttonIsolatedStrategy: same mirror
# - PR #2588 (Cash-A gated to high/low only — cash_a_active guard)
#
# Run
# ---
#   uv run python experiments/run_experiment.py \
#     --config experiments/configs/loner_void_h2h.yaml \
#     --seed 42

experiment_name: loner_void_h2h

parameters:
  n_per: 5000
  seed: 42
  # hand_end records required by
  # src/bid_euchre/analysis/paired.py::load_paired_data.
  log_level: hand
  mode: head_to_head_matrix
  # Same physical deals across all scenarios and matchups -> paired
  # bootstrap analysis on matched (deal_id, seed) keys.
  pair_deals: true

strategies:
  # Void-lead ON — the candidate play strategy under evaluation.
  # cash_winners_on_lead=True is current production (post PR #2588 default flip).
  - name: glutton_void_on
    class_name: GluttonStrategy
    params:
      cash_winners_on_lead: true
      void_backed_lead: true

  # Void-lead OFF — the baseline (current production behaviour).
  - name: glutton_void_off
    class_name: GluttonStrategy
    params:
      cash_winners_on_lead: true
      void_backed_lead: false

matchups:
  # Void-lead as Team 0 (seats 0, 2)
  - team0: glutton_void_on
    team1: glutton_void_off

  # Seat-swapped: Void-lead as Team 1 (seats 1, 3) — controls for seat bias
  - team0: glutton_void_off
    team1: glutton_void_on

# Canonical 6-scenario comparison surface.
# Forced contracts — no bidding policy invoked.
# High and low are primary signals; suit variants are inertness controls.
scenarios:
  - name: suit_C
    contract_type: suit
    trump_suit: C

  - name: suit_D
    contract_type: suit
    trump_suit: D

  - name: suit_H
    contract_type: suit
    trump_suit: H

  - name: suit_S
    contract_type: suit
    trump_suit: S

  - name: high
    contract_type: high

  - name: low
    contract_type: low
