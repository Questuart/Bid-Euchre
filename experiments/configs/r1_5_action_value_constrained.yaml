# R1.5 Action-Value Evaluation — Constrained arm
# Self-play: ActionValueBidder (constrained, locked base features) vs itself
#
# Requires trained artifact at data/artifacts/arc_d/r1_5/action_value_constrained.json
#
# Run with:
#   uv run python experiments/run_experiment.py \
#     --config experiments/configs/r1_5_action_value_constrained.yaml --seed 42

experiment_name: r1_5_action_value_constrained

bidding_policies:
  - name: action_value_constrained_r1_5
    class_name: ActionValueBidder
    params:
      artifact_path: data/artifacts/arc_d/r1_5/action_value_constrained.json

scenarios:
  - contract_type: null  # Auction mode

parameters:
  n_per: 50000
  seed: 42
  log_level: hand
