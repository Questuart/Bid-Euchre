# R1.5 Action-Value Evaluation — Full arm
# Self-play: ActionValueBidder (full, forward-selected features) vs itself
#
# Requires trained artifact at data/artifacts/arc_d/r1_5/action_value_full.json
#
# Run with:
#   uv run python experiments/run_experiment.py \
#     --config experiments/configs/r1_5_action_value_full.yaml --seed 42

experiment_name: r1_5_action_value_full

bidding_policies:
  - name: action_value_full_r1_5
    class_name: ActionValueBidder
    params:
      artifact_path: data/artifacts/arc_d/r1_5/action_value_full.json

scenarios:
  - contract_type: null  # Auction mode

parameters:
  n_per: 50000
  seed: 42
  log_level: hand
