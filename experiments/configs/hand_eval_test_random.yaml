# Hand Evaluation Testing Configuration
# Small run to test full 40+ feature logging

experiment_name: hand_eval_test_random

strategies:
  - name: random_legal
    class_name: RandomLegalStrategy

scenarios:
  - contract_type: suit
    trump_suit: H
  - contract_type: suit
    trump_suit: S
  - contract_type: high
  - contract_type: low

parameters:
  n_per: 50000  # 2500 hands per scenario = 10k total
  seed: 11
  log_level: hand  # Enable full hand logging with all features
