# Lambda H2H Confirmation: lambda=0.5 (PROVISIONAL) vs lambda=0.0 (baseline)
#
# Per r0_v2_lambda_tuning_protocol.md §8.5:
# Non-zero lambda requires H2H confirmation before FINAL status.
#
# Design: 3 matchups (self-play + both rotations) with paired deals.
# All trick play uses GluttonStrategy; only lambda differs.
#
# 3 matchups × 1 scenario × 10,000 hands = 30,000 hands.

experiment_name: lambda_h2h_confirmation

parameters:
  seed: 42
  n_per: 10000
  log_level: hand
  mode: head_to_head_matrix
  pair_deals: true

strategies:
  - name: glutton
    class_name: GluttonStrategy

bidding_policies:
  - name: hybrid_olsa_lambda05
    class_name: HybridOLSaBidder
    params:
      artifact_path: data/artifacts/arc_d/r0/hybrid_r0.json
      bid_level_search: true
      risk_lambda: 0.5
      pass_threshold: 0.0

  - name: hybrid_olsa_lambda00
    class_name: HybridOLSaBidder
    params:
      artifact_path: data/artifacts/arc_d/r0/hybrid_r0.json
      bid_level_search: true
      risk_lambda: 0.0
      pass_threshold: 0.0

matchups:
  # Self-play lambda=0.5
  - matchup_id: lambda05_self_play
    team0: glutton
    team1: glutton
    seat_bidding_policies: [hybrid_olsa_lambda05, hybrid_olsa_lambda05, hybrid_olsa_lambda05, hybrid_olsa_lambda05]

  # Self-play lambda=0.0
  - matchup_id: lambda00_self_play
    team0: glutton
    team1: glutton
    seat_bidding_policies: [hybrid_olsa_lambda00, hybrid_olsa_lambda00, hybrid_olsa_lambda00, hybrid_olsa_lambda00]

  # Cross-matchup: lambda=0.5 on team0 (seats 0,2) vs lambda=0.0 on team1 (seats 1,3)
  - matchup_id: lambda05_vs_lambda00
    team0: glutton
    team1: glutton
    seat_bidding_policies: [hybrid_olsa_lambda05, hybrid_olsa_lambda00, hybrid_olsa_lambda05, hybrid_olsa_lambda00]

  # Cross-matchup: lambda=0.0 on team0 vs lambda=0.5 on team1
  - matchup_id: lambda00_vs_lambda05
    team0: glutton
    team1: glutton
    seat_bidding_policies: [hybrid_olsa_lambda00, hybrid_olsa_lambda05, hybrid_olsa_lambda00, hybrid_olsa_lambda05]

scenarios:
  - contract_type: null   # Auction mode — bidders actually bid
