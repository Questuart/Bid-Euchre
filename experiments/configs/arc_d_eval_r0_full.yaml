# Arc D R0 Evaluation — OLSa_Full (full arm)
# Self-play: HybridOLSaBidder R0 Full vs HybridOLSaBidder R0 Full
#
# Run with:
#   uv run python experiments/run_experiment.py \
#     --config experiments/configs/arc_d_eval_r0_full.yaml --seed 42

experiment_name: arc_d_eval_r0_full

bidding_policies:
  - name: hybrid_olsa_r0_full
    class_name: HybridOLSaBidder
    params:
      artifact_path: data/artifacts/arc_d/r0/hybrid_r0_full.json
      bid_level_search: true

scenarios:
  - contract_type: null  # Auction mode

parameters:
  n_per: 50000
  seed: 42
  log_level: hand
