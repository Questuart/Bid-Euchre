# Strategy Comparison Experiment Configuration
# Compare all implemented strategies on common deals

experiment_name: strategy_comparison

strategies:
  - name: greedy
    class_name: GreedyStrategy
  
  - name: glutton
    class_name: GluttonStrategy
    params:
      debug: false
  
  - name: random_legal
    class_name: RandomLegalStrategy
    params:
      seed: 42
  
  - name: always_lowest
    class_name: AlwaysLowestLegalStrategy
  
  - name: always_highest
    class_name: AlwaysHighestLegalStrategy

scenarios:
  - contract_type: suit
    trump_suit: C,D,H,S
  - contract_type: high
  - contract_type: low

parameters:
  n_per: 50000
  seed: 42
  log_level: hand

