# R1.5 Self-Play — ActionValueBidder v1 (risk-neutral)
# 3-seed catastrophic-behavior screen before H2H battery
#
# Run with:
#   uv run python experiments/run_experiment.py \
#     --config experiments/configs/r1_5_self_play.yaml --seed 42

experiment_name: r1_5_self_play

bidding_policies:
  - name: action_value_v1
    class_name: ActionValueBidder
    params:
      artifact_path: data/artifacts/arc_d/r1_5/action_value_full.json

scenarios:
  - contract_type: null  # Auction mode

parameters:
  n_per: 2500
  seed: 42
  log_level: hand
