# Suit-continuity per-contract-type head-to-head comparator (bidless)
#
# Purpose
# -------
# Measure the competitive advantage of suit continuity (step 0.25 in
# GluttonStrategy's lead selection) per contract type. Pits Glutton with
# suit continuity ON against Glutton with suit continuity OFF on the same
# deals with forced (pre-declared) contracts. No bidding policy is used —
# the contract is fixed per scenario, isolating pure play-strategy differences.
#
# Design
# ------
# Team 0 (seats 0, 2): GluttonIsolatedStrategy with suit_continuity=True
# Team 1 (seats 1, 3): GluttonIsolatedStrategy with suit_continuity=False
#
# Both strategies have ALL features enabled (smart_leads, smart_discards,
# third_seat_aggression, partner_awareness, sure_winner_cover, partner_check,
# trump_gating, probabilistic_trump_in, lead_bower) to match GluttonStrategy
# behavior. cash_winners_on_lead=False (GluttonStrategy default). The ONLY
# difference is the suit_continuity flag.
#
# Both seat rotations are included to control for seat bias. Pool the two
# matchup directions with sign flip for the final estimate.
#
# Context
# -------
# PR #2602 shipped suit continuity as always-on in GluttonStrategy with no
# experiment gating. Post-merge review (#2607) flagged that Cash-A (a similar
# play heuristic) showed contract-type-dependent effects: +0.66 Δ in high/low
# but -0.13 Δ in suit, requiring per-contract gating. This experiment checks
# whether suit continuity has similar contract-type-dependent effects.
#
# Compute budget
# --------------
# 2 matchups × 6 scenarios × 5,000 deals = 60,000 hands. At ~5,000
# hands/sec bidless throughput this completes in ~12 s.
#
# MDE at n=5000 per scenario (paired SD ≈ 1.0 on tricks_team0):
# ~0.055 tricks at 95% CI.
#
# Analysis plan
# -------------
# - Primary: paired bootstrap delta on tricks_team0 per contract type per
#   matchup direction
# - Pool both directions with sign flip to control seat bias
# - Expected: suit continuity should primarily affect suit contracts (the
#   heuristic only fires in the suit-contract lead path)
# - High/low deltas should be near zero (inertness confirmation)
#
# Depends on
# ----------
# - PR #2602 (suit continuity implementation)
# - Issue #2607 (post-merge review finding)
# - Cash-A experiment design: experiments/configs/cash_a_h2h_per_contract.yaml
#
# Run
# ---
#   uv run python experiments/run_experiment.py \
#     --config experiments/configs/suit_continuity_h2h_per_contract.yaml \
#     --seed 42

experiment_name: suit_continuity_h2h_per_contract

parameters:
  n_per: 5000
  seed: 42
  # hand_end records required by
  # src/bid_euchre/analysis/paired.py::load_paired_data.
  log_level: hand
  mode: head_to_head_matrix
  # Same physical deals across all scenarios and matchups -> paired
  # bootstrap analysis on matched (deal_id, seed) keys.
  pair_deals: true

strategies:
  # Suit continuity ON — the candidate under evaluation.
  # All features enabled to match GluttonStrategy behavior.
  - name: glutton_sc_on
    class_name: GluttonIsolatedStrategy
    params:
      smart_leads: true
      smart_discards: true
      third_seat_aggression: true
      partner_awareness: true
      sure_winner_cover: true
      partner_check: true
      trump_gating: true
      probabilistic_trump_in: true
      lead_bower: true
      cash_winners_on_lead: false
      suit_continuity: true

  # Suit continuity OFF — the baseline (pre-PR #2602 behavior).
  # Identical to above except suit_continuity=false.
  - name: glutton_sc_off
    class_name: GluttonIsolatedStrategy
    params:
      smart_leads: true
      smart_discards: true
      third_seat_aggression: true
      partner_awareness: true
      sure_winner_cover: true
      partner_check: true
      trump_gating: true
      probabilistic_trump_in: true
      lead_bower: true
      cash_winners_on_lead: false
      suit_continuity: false

matchups:
  # Suit continuity ON as Team 0 (seats 0, 2)
  - team0: glutton_sc_on
    team1: glutton_sc_off

  # Seat-swapped: Suit continuity ON as Team 1 (seats 1, 3) — controls for seat bias
  - team0: glutton_sc_off
    team1: glutton_sc_on

# Canonical 6-scenario comparison surface.
# Forced contracts — no bidding policy invoked.
scenarios:
  - name: suit_C
    contract_type: suit
    trump_suit: C

  - name: suit_D
    contract_type: suit
    trump_suit: D

  - name: suit_H
    contract_type: suit
    trump_suit: H

  - name: suit_S
    contract_type: suit
    trump_suit: S

  - name: high
    contract_type: high

  - name: low
    contract_type: low
