# tmux layout configuration for Bid Euchre agent-ops session.
# Sourced by agent-ops-session.sh after window creation.
#
# To customize, edit this file and restart the tmux session,
# or reload with: tmux source-file .claude/tmux/agent-ops-layout.conf

# --- general defaults -------------------------------------------------------

# Increase scrollback buffer
set-option -g history-limit 50000

# Enable mouse support (scroll, pane selection, window selection)
set-option -g mouse on

# Reduce escape delay for faster key response
set-option -sg escape-time 10

# Use 256 colors
set-option -g default-terminal "screen-256color"

# --- status bar -------------------------------------------------------------

# Status bar position
set-option -g status-position bottom

# Status bar style
set-option -g status-style "bg=colour235,fg=colour248"

# Left status: session name
set-option -g status-left " #[fg=colour39,bold][#S]#[default] "
set-option -g status-left-length 30

# Right status: date and time
set-option -g status-right " #[fg=colour248]%Y-%m-%d %H:%M "
set-option -g status-right-length 30

# Window list style
set-option -g window-status-format " #I:#W "
set-option -g window-status-current-format "#[fg=colour235,bg=colour39,bold] #I:#W "

# --- window-specific labels -------------------------------------------------

# Color-code windows by role for at-a-glance identification:
#   author  = green (colour40)
#   review  = yellow (colour220)
#   ops     = cyan (colour51)
#   scratch = default (colour248)
#
# Note: tmux window-status colors apply to the status bar tab only.
# Per-window coloring requires hooks or manual rename; the status-current
# format above highlights whichever window is active.

# --- key bindings -----------------------------------------------------------

# Quick window switching with Alt+number (no prefix needed)
bind-key -n M-1 select-window -t :0
bind-key -n M-2 select-window -t :1
bind-key -n M-3 select-window -t :2
bind-key -n M-4 select-window -t :3
