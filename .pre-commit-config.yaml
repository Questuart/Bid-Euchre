repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(data/|experiments/|scripts/)
      - id: end-of-file-fixer
        exclude: ^(data/|experiments/|scripts/)
      - id: check-yaml
        exclude: ^(data/|experiments/|scripts/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^(data/.*|experiments/_deprecated/.*)

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        files: ^notebooks/.*\.ipynb$

  - repo: https://github.com/mwouts/jupytext
    rev: v1.19.1
    hooks:
      - id: jupytext
        args: [--sync]
        files: ^notebooks/.*\.ipynb$

  - repo: local
    hooks:
      - id: repo-linter
        name: repo-linter
        entry: python scripts/lint_repo.py --base origin/main --head HEAD
        language: system
        pass_filenames: false

      - id: validate-configs
        name: Validate experiment configs
        entry: python scripts/validate_configs.py
        language: system
        files: ^experiments/(configs|suites)/.*\.yaml$
        pass_filenames: false

      - id: no-commits-from-main-checkout
        name: Block commits from main checkout
        entry: |
          bash -c 'MAIN_DIR="/Users/claude_runner/Projects/Bid-Euchre-meta/Bid-Euchre"; CURRENT_DIR="$(git rev-parse --show-toplevel)"; CURRENT_BRANCH="$(git branch --show-current)"; if [ "$CURRENT_DIR" = "$MAIN_DIR" ] && [ "$CURRENT_BRANCH" = "main" ]; then echo ""; echo "⛔ ERROR: Commits from main checkout are not allowed."; echo ""; echo "This repository requires worktree-only workflow."; echo "Create a worktree: git worktree add ../Bid-Euchre-<branch> <branch>"; echo ""; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]
